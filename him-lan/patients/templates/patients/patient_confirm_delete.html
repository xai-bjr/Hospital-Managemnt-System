{% extends 'patients/base.html' %}
{% block content %}
<div class="alert alert-danger" style="max-width: 500px; margin: auto;">
    <h4>Confirm Deletion</h4>
    <p>Are you sure you want to delete the record for <strong>{{ object.first_name }} {{ object.last_name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'patient_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
